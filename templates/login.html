<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login | Library Habit Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#1e1b4b,#312e81);
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#f9fafb;
    }
    .box{
      background:rgba(15,23,42,0.95);
      padding:28px 24px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      width:340px;
      max-width:92%;
      text-align:center;
    }
    h2{margin:0 0 6px;font-size:22px;}
    p{margin:0 0 16px;font-size:13px;color:#cbd5f5;}
    input{
      width:100%;
      padding:11px 12px;
      margin:7px 0;
      border-radius:10px;
      border:none;
      outline:none;
      background:rgba(255,255,255,0.08);
      color:#f9fafb;
      font-size:14px;
    }
    input::placeholder{color:#cbd5f5;}
    button{
      width:100%;
      margin-top:12px;
      padding:10px 0;
      border-radius:10px;
      border:none;
      background:#38bdf8;
      color:#0f172a;
      font-weight:600;
      font-size:14px;
      cursor:pointer;
    }
    .meta{font-size:12px;margin-top:14px;color:#cbd5f5;}
    a{color:#e5e7eb;text-decoration:underline;font-weight:600;}
    #loginMessage{font-size:12px;margin-top:8px;}
  </style>
</head>
<body>
  <div class="box">
    <h2>Welcome back 👋</h2>
    <p>Login to your Library Habit Tracker dashboard.</p>

    <form onsubmit="loginUser(event)">
      <input id="li_email" type="email" placeholder="Email Address" required>
      <input id="li_password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div id="loginMessage"></div>

    <div class="meta">
      New here?
      <a href="/signup">Create account</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
