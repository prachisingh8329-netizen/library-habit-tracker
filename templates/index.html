<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Library Habit Tracker — Get Started</title>
  <style>
    *{box-sizing:border-box;font-family:Inter,'Poppins',sans-serif}
    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(135deg,#1e3a8a,#06b6d4);
      display:flex;
      justify-content:center;
      align-items:center;
      color:#f9fafb;
    }
    .card{
      background:rgba(15,23,42,0.9);
      padding:28px 24px;
      border-radius:18px;
      max-width:420px;
      width:90%;
      box-shadow:0 18px 40px rgba(15,23,42,0.5);
      text-align:center;
    }
    h1{margin:0 0 8px;font-size:24px;}
    p{margin:4px 0 16px;font-size:14px;color:#e5e7eb;}
    .btn{
      display:block;
      width:100%;
      padding:10px 0;
      border-radius:999px;
      border:none;
      margin-top:10px;
      font-size:14px;
      cursor:pointer;
      font-weight:600;
    }
    .btn-primary{background:#38bdf8;color:#0f172a;}
    .btn-outline{background:transparent;border:1px solid #38bdf8;color:#e5e7eb;}
    .small{font-size:12px;margin-top:10px;color:#cbd5f5;}
  </style>
</head>
<body>
  <div class="card">
    <h1>📚 Library Habit Tracker</h1>
    <p>Track your reading mood, CS books, calendar, and progress in one place.</p>

    <button class="btn btn-primary" onclick="location.href='/signup'">
      Get Started — Create Account
    </button>
    <button class="btn btn-outline" onclick="location.href='/login'">
      I already have an account
    </button>

    <div class="small">
      After login you will be redirected to your dashboard.
    </div>
  </div>
</body>
</html>
