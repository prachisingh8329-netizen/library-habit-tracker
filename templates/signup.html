<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign Up - Library Habit Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a8a, #2563eb, #4f46e5);
    }
    .card {
      width: 360px;
      max-width: 95%;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(15,23,42,0.45);
      padding: 32px 26px 24px;
      text-align: center;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #0f172a;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .field {
      text-align: left;
      margin-bottom: 14px;
      font-size: 13px;
      color: #0f172a;
    }
    .field label {
      display: block;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5f5;
      font-size: 14px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37,99,235,0.2);
    }
    .btn {
      width: 100%;
      margin-top: 8px;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(90deg,#f97316,#ec4899);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(236,72,153,0.4);
      opacity: 0.95;
    }
    .switch-text {
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
    }
    .switch-text a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
    .switch-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">Create Account ✨</div>
    <div class="subtitle">Sign up to start tracking your library habits.</div>

    <!-- IMPORTANT: yahi function JS me call hoga -->
    <form onsubmit="signupUser(event)">
      <div class="field">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Prachi Singh" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Create a password" required>
      </div>

      <button class="btn" type="submit">Sign Up</button>
    </form>

    <div class="switch-text">
      Already have an account?
      <a href="/login">Login</a>
    </div>
  </div>

  <!-- JS file jahan signupUser() defined hai -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
