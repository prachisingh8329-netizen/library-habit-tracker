<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign Up | Library Habit Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#1e3c72,#2a5298);
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:#fff;
    }
    .circle{
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,0.15);
      animation:float 10s infinite;
    }
    .circle:nth-child(1){width:150px;height:150px;top:10%;left:15%;animation-delay:0s;}
    .circle:nth-child(2){width:200px;height:200px;bottom:15%;right:20%;animation-delay:3s;}
    @keyframes float{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-18px);}
    }
    .box{
      position:relative;
      width:360px;
      max-width:92%;
      padding:30px 26px;
      background:rgba(15,23,42,0.9);
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,0.45);
      backdrop-filter:blur(12px);
      text-align:center;
    }
    h2{margin:0 0 8px;font-size:22px;}
    p{margin:0 0 16px;font-size:13px;color:#e5e7eb;}
    input{
      width:100%;
      padding:11px 12px;
      margin:7px 0;
      border-radius:10px;
      border:none;
      outline:none;
      background:rgba(255,255,255,0.08);
      color:#f9fafb;
      font-size:14px;
    }
    input::placeholder{color:#cbd5f5;}
    button{
      width:100%;
      margin-top:12px;
      padding:10px 0;
      border-radius:10px;
      border:none;
      background:#38bdf8;
      color:#0f172a;
      font-weight:600;
      font-size:14px;
      cursor:pointer;
    }
    .meta{font-size:12px;margin-top:14px;color:#cbd5f5;}
    a{color:#e5e7eb;text-decoration:underline;font-weight:600;}
    #signupMessage{font-size:12px;margin-top:8px;}
  </style>
</head>
<body>
  <div class="circle"></div>
  <div class="circle"></div>

  <div class="box">
    <h2>Create your account</h2>
    <p>Sign up to start tracking your library habits and CS reading.</p>

    <form onsubmit="signupUser(event)">
      <!-- NAME: only letters, max 15 chars -->
      <input
        id="su_name"
        type="text"
        placeholder="Full Name"
        required
        maxlength="15"
        pattern="[A-Za-z]{1,15}"
        title="Name must contain only letters (A–Z) and max 15 characters."
      >

      <!-- EMAIL: must end with .com -->
      <input
        id="su_email"
        type="email"
        placeholder="Email Address"
        required
        pattern="^[^@\s]+@[^@\s]+\.com$"
        title="Enter a valid email that ends with .com"
      >

      <input id="su_password" type="password" placeholder="Password" required>

      <button type="submit">Sign Up</button>
    </form>

    <div id="signupMessage"></div>

    <div class="meta">
      Already have an account?
      <a href="/login">Login</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
