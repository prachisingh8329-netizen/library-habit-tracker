<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Library Habit Tracker — Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Inter,'Poppins',sans-serif;
    background:linear-gradient(120deg,#e0f2fe,#fafafa);
    padding:20px;
    color:#0f172a;
}
.container{max-width:1000px;margin:auto;}
header{
    background:white;
    padding:16px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    margin-bottom:15px;
}
.card{
    background:white;
    padding:16px;
    border-radius:12px;
    box-shadow:0 6px 15px rgba(0,0,0,0.05);
    margin-bottom:14px;
}
h1{margin:0;font-size:22px;}
label{font-size:14px;color:#475569;}
input,select,textarea{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #cbd5e1;
    margin-top:5px;
}
textarea{min-height:80px;}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{
    background:#2563eb;color:white;
    padding:8px 12px;border-radius:8px;
    border:none;cursor:pointer;font-size:13px;
}
.btn-ghost{
    background:transparent;
    border:1px solid #2563eb;
    color:#2563eb;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
}
.meta{font-size:13px;color:#64748b}

/* Calendar */
#calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-top:8px;
}
.cal-cell{
    background:#e5e7eb;
    text-align:center;
    padding:8px;
    border-radius:8px;
    cursor:pointer;
}
.cal-cell.header{
    background:#bfdbfe;
    font-weight:bold;
}
.cal-cell.read{
    background:#93c5fd;
}
.cal-cell.active{
    outline:2px solid #1d4ed8;
}
.comment{
    background:#f1f5f9;
    padding:8px;border-radius:8px;
    margin-top:5px;font-size:13px
}
</style>
</head>
<body>

<div class="container">

<header>
<h1>📚 Library Habit Tracker</h1>
<p class="meta" id="greeting"></p>
</header>

<!-- FEELING -->
<div class="card">
<label>How are you feeling today?</label>
<select id="feeling">
<option>Select mood</option>
<option>😊 Happy</option>
<option>😌 Calm</option>
<option>🤩 Motivated</option>
<option>😔 Tired</option>
<option>😤 Stressed</option>
<option>😴 Sleepy</option>
</select>
<p class="meta">Suggestion: <b id="suggestion"></b></p>
</div>

<!-- SEARCH -->
<div class="card">
<label>Search Computer Science Book</label>
<div class="row">
<input id="searchBox" placeholder="Algorithms, DBMS, OS..." />
<button class="btn" onclick="doSearch()">Search</button>
</div>
<div id="searchResults"></div>
</div>

<!-- CALENDAR -->
<div class="card">
<label>Reading Calendar</label>
<div class="row" style="justify-content:space-between">
<button class="btn-ghost" onclick="prevMonth()">◀</button>
<span id="monthLabel"></span>
<button class="btn-ghost" onclick="nextMonth()">▶</button>
</div>
<div id="calendar"></div>
<p class="meta" id="calendarInfo">Click a date to add reading minutes</p>
</div>

<!-- GRAPH -->
<div class="card">
<label>Monthly Reading Graph</label>
<canvas id="monthChart" height="140"></canvas>
</div>

<!-- CHAPTER -->
<div class="card">
<label>Chapter Progress</label>
<div class="row">
<div style="flex:1">
<input id="totalChapters" type="number" placeholder="Total chapters">
</div>
<div style="flex:1">
<input id="doneChapters" type="number" placeholder="Completed chapters">
</div>
</div>
<button class="btn" style="margin-top:6px" onclick="updateChapters()">Update</button>
<p class="meta" id="chapterInfo"></p>
</div>

<!-- PREDICTION -->
<div class="card">
<label>Page-Time Prediction</label>
<div class="row">
<div style="flex:1"><input id="totalPages" placeholder="Total pages"></div>
<div style="flex:1"><input id="pagesPerDay" placeholder="Pages per day"></div>
</div>
<button class="btn" style="margin-top:6px" onclick="predictFinish()">Predict</button>
<p class="meta" id="predictionResult"></p>
</div>

<!-- AI SUMMARY -->
<div class="card">
<label>AI Summary (Demo)</label>
<div class="row">
<input id="summaryBookId" placeholder="Book ID">
<button class="btn" onclick="generateSummary()">Generate</button>
</div>
<p class="meta" id="summaryText"></p>
</div>

<!-- COMMENTS -->
<div class="card">
<label>Comments</label>
<textarea id="commentInput"></textarea>
<button class="btn" onclick="addComment()">Add</button>
<div id="comments"></div>
</div>

</div>

<script>
// Greeting
const h=new Date().getHours();
document.getElementById("greeting").innerText =
h<12?"Good Morning 🌅":h<18?"Good Afternoon 🌤":"Good Evening 🌙";

// Mood
const suggestion={
"😊 Happy":"Read challenging topics.",
"😌 Calm":"Best for theory reading.",
"🤩 Motivated":"Finish one whole chapter.",
"😔 Tired":"Read summary only.",
"😤 Stressed":"Keep it light & short.",
"😴 Sleepy":"Read for 5 minutes only."
};
document.getElementById("feeling").onchange=e=>{
document.getElementById("suggestion").innerText=suggestion[e.target.value]||"";
};

// Dummy Search
function doSearch(){
let q=searchBox.value;
searchResults.innerHTML=`
<div class="meta">Showing CS books for: <b>${q}</b></div>
<ul>
<li>Operating System</li>
<li>DBMS</li>
<li>Computer Networks</li>
<li>Data Structures</li>
</ul>
`;
}

// Calendar & Graph
let readingData={};
let currentMonth=new Date().getMonth();
let currentYear=new Date().getFullYear();
let chart;

function key(d){return d.toISOString().slice(0,10);}
function getMins(d){return readingData[key(d)]||0;}
function setMins(d,m){readingData[key(d)]=(readingData[key(d)]||0)+m;}

function renderCalendar(){
calendar.innerHTML="";
const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
days.forEach(h=>calendar.innerHTML+=<div class="cal-cell header">${h}</div>);

const first=new Date(currentYear,currentMonth,1).getDay();
const total=new Date(currentYear,currentMonth+1,0).getDate();
monthLabel.innerText=
new Date(currentYear,currentMonth).toLocaleDateString("en",{month:"long",year:"numeric"});

for(let i=0;i<first;i++)calendar.innerHTML+=<div></div>;

for(let d=1;d<=total;d++){
let date=new Date(currentYear,currentMonth,d);
let cell=document.createElement("div");
cell.className="cal-cell";
cell.textContent=d;

if(getMins(date)>0)cell.classList.add("read");

cell.onclick=()=>{
let m=prompt("Minutes read?");
if(m>0){setMins(date,parseInt(m));renderCalendar();updateChart();}
};
calendar.appendChild(cell);
}
updateChart();
}

function prevMonth(){currentMonth--;if(currentMonth<0){currentMonth=11;currentYear--;}renderCalendar();}
function nextMonth(){currentMonth++;if(currentMonth>11){currentMonth=0;currentYear++;}renderCalendar();}

function updateChart(){
const labels=[], values=[];
let days=new Date(currentYear,currentMonth+1,0).getDate();

for(let d=1;d<=days;d++){
labels.push(d);
values.push(getMins(new Date(currentYear,currentMonth,d)));
}

if(chart)chart.destroy();
chart=new Chart(monthChart,{
type:"bar",
data:{labels,datasets:[{data:values,backgroundColor:"#3b82f6"}]},
options:{scales:{y:{beginAtZero:true}},plugins:{legend:{display:false}}}
});
}

// Chapter
function updateChapters(){
let t=+totalChapters.value||0;
let d=+doneChapters.value||0;
if(d>t)d=t;
chapterInfo.innerText=${d}/${t} chapters completed;
}

// Prediction
function predictFinish(){
let t=+totalPages.value;
let p=+pagesPerDay.value;
if(!t||!p){predictionResult.innerText="Enter both values";return;}
predictionResult.innerText=Finish in about ${Math.ceil(t/p)} days;
}

// AI Summary
function generateSummary(){
summaryText.innerText="This book explains core CS topics clearly and practically.";
}

// Comments
function addComment(){
let c=commentInput.value;
if(!c)return;
comments.innerHTML=<div class="comment">${c}</div>+comments.innerHTML;
commentInput.value="";
}

// INIT
renderCalendar();
</script>

</body>
</html>
